[package]
name = "osci-cli"
description = "The curl of OSCI — send arbitrary XTA through OSCI-Transport 1.2 without the ceremony."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rosci"
path = "src/main.rs"

[dependencies]
osci = { path = "../osci" }
base64 = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
zeroize = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
proptest = { workspace = true }
sha2 = "0.11"
# The CLI tests drive a scripted oscirs intermediary in-process.
osci_rs = { package = "osci", git = "https://github.com/hauksch/oscirs", rev = "0749730e8baad6d840a7e39fd717c342c7fa2c8d" }
osci_core = { package = "osci-core", git = "https://github.com/hauksch/oscirs", rev = "0749730e8baad6d840a7e39fd717c342c7fa2c8d" }
chrono = "0.4"
