[package]
name = "osci"
description = "Modern Rust API around the Governikus OSCI-Transport-1.2 Java library — the curl of OSCI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# OSCI-Rust-Rewrite stack (dialogs, message compose/parse, crypto, transport).
# Pinned by rev until oscirs starts tagging; bump via `cargo update -p osci_rs`.
osci_rs = { package = "osci", git = "https://github.com/hauksch/oscirs", rev = "0749730e8baad6d840a7e39fd717c342c7fa2c8d" }
osci_crypto = { package = "osci-crypto", git = "https://github.com/hauksch/oscirs", rev = "0749730e8baad6d840a7e39fd717c342c7fa2c8d" }
osci_core = { package = "osci-core", git = "https://github.com/hauksch/oscirs", rev = "0749730e8baad6d840a7e39fd717c342c7fa2c8d" }
osci_transport = { package = "osci-transport", git = "https://github.com/hauksch/oscirs", rev = "0749730e8baad6d840a7e39fd717c342c7fa2c8d" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
# PKCS#12 keystore parsing (the bridge identity format). Legacy OSCI
# keystores use PBES1 3DES/RC2, so the legacy cipher features stay on.
p12-keystore = "0.4"
rand = "0.8"
rsa = { version = "0.9.10", features = ["sha2"] }
tracing = { workspace = true }
zeroize = { workspace = true, features = ["serde"] }

[lints.rust]
missing_docs = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3"
proptest = { workspace = true }
# Integration tests drive the oscirs types directly (scripted mock).
osci_rs = { package = "osci", git = "https://github.com/hauksch/oscirs", rev = "0749730e8baad6d840a7e39fd717c342c7fa2c8d" }
osci_core = { package = "osci-core", git = "https://github.com/hauksch/oscirs", rev = "0749730e8baad6d840a7e39fd717c342c7fa2c8d" }
