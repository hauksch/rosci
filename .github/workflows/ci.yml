name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # xmllint validates captured OSCI wire traffic against the normative
      # schemas (docs/STANDARD-COMPLIANCE.md §3.4); openssl signs the
      # per-run throwaway test PKI
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: cargo deny (licenses, advisories, sources)
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-deny
      - run: cargo deny --config deny.toml check --hide-inclusion-graph licenses advisories sources
      - run: bash -c 'cd fuzz && cargo deny --config ../deny.toml check --hide-inclusion-graph advisories sources'
