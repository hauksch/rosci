# cargo-deny configuration: licenses must be permissive, advisories fail the
# build, and crates.io is the only crate source. Simple rules, enforced by
# machine, because "we reviewed it" is not a control, it's a memory.
# Shape aligned with the sibling repos (oscirs, safedir).

[graph]
# Evaluate the graph with every feature enabled, matching the widest
# build the CI runs.
all-features = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2023-0071 (Marvin Attack on the RustCrypto `rsa` crate): no patched
# release exists. This replaces the BouncyCastle v1.5-unwrap exposure the Java
# bridge carried — same vulnerability class, same transport-only surface
# (RSAES-PKCS1-v1_5 key unwrap of partner-chosen ciphertexts). Revisit when
# RustCrypto/RSA#626 lands; see SECURITY.md.
ignore = [
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0387 (crypto-bigint timing variability): the fix is a
    # semver bump to 0.7.x that elliptic-curve 0.13 (p256 ECDSA in the
    # oscirs crypto stack) cannot take yet — upstream-blocked. Exposure is
    # on the ECDSA *verify* path only (partner signatures); our private-key
    # operations are RSA. Revisit when oscirs moves to p256 0.14.
    "RUSTSEC-2026-0387",
]

[licenses]
version = 2
# Allow-list shared with the sibling repos; entries cover everything
# actually encountered in the resolved tree. A dependency needing a new
# license fails the gate with the license named — add it consciously
# after a look at the crate.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  # webpki-roots: Mozilla root-store data (not code), permissive data license.
  "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  # The OSCI-Rust-Rewrite stack, pinned by rev in crates/osci/Cargo.toml.
  "https://github.com/hauksch/oscirs",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
