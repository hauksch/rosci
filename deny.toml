# cargo-deny configuration: licenses must be permissive, advisories fail the
# build, and crates.io is the only crate source. Simple rules, enforced by
# machine, because "we reviewed it" is not a control, it's a memory.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "warn"
