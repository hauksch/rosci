[workspace]
resolver = "2"
members = ["crates/osci", "crates/osci-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "none" # mission rule: this repo never leaves the building

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
tracing = "0.1"
proptest = "1.11"

[profile.release]
strip = true
lto = "thin"
