[workspace]
resolver = "2"
members = ["crates/osci", "crates/osci-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false # crates.io publication is a separate, later decision
repository = "https://github.com/hauksch/rosci"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.23"
tracing = "0.1"
proptest = "1.11"
zeroize = "1.9"

[profile.release]
strip = true
lto = "thin"
